# Publishes the site to Cloudflare Pages (englishpath-1w0.pages.dev) on every push to main.
# Needs the repository secret CLOUDFLARE_API_TOKEN (permission: Cloudflare Pages — Edit)
# and the repository variable CLOUDFLARE_ACCOUNT_ID.
name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cloudflare-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Deploy
        run: npx wrangler pages deploy --branch main --commit-hash "$GITHUB_SHA" --commit-message "${GITHUB_SHA::7}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
